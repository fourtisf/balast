  <g transform="translate(3.2 3.2) scale(0.8)">
    <path d="M 4 7.5 L 4 12.5 A 12 12 0 0 0 28 12.5 L 28 7.5 L 22 7.5 L 22 12.5 A 6 6 0 0 1 10 12.5 L 10 7.5 Z"
          fill="#3DD68C" stroke="#3DD68C" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
