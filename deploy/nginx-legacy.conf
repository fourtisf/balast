# balast.xyz, the site's old name (§39). Every link anyone shared while the
# site lived there lands here and is sent on to lockfi.org, path and all.
#
# Its own file because it needs balast.xyz's certificate: deploy.sh installs
# it only on a box that has one, so a fresh server is not left with an nginx
# config that fails `nginx -t`.

server {
    listen 80;
    listen [::]:80;
    server_name balast.xyz www.balast.xyz;

    # The certificate below still has to renew, or the redirect stops working
    # over HTTPS in 90 days and every old link breaks.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://lockfi.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name balast.xyz www.balast.xyz;

    ssl_certificate     /etc/letsencrypt/live/balast.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/balast.xyz/privkey.pem;

    return 301 https://lockfi.org$request_uri;
}
