# First pass only: HTTP, no TLS, so nginx can start before any certificate
# exists and answer the ACME challenge. Replaced by deploy/nginx.conf once
# certbot has issued the certificate.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name balast.xyz www.balast.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
