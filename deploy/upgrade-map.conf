# Required by the proxy_set_header Connection line in the site config.
# Install to /etc/nginx/conf.d/upgrade-map.conf — it has to live in the http{}
# context, which is why it is a separate file rather than part of the site.
#
# P1's websocket needs this. Without it `nginx -t` fails on an unknown
# variable before it ever gets to the site config.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
