# Nginx site for Depth (§2: Hostinger VPS, PM2, Nginx).
# Copy to /etc/nginx/sites-available/depth, symlink into sites-enabled, then
# `nginx -t && systemctl reload nginx`. TLS is issued separately with certbot.

server {
    listen 80;
    listen [::]:80;
    server_name depth.example.com;      # set once the domain is decided (§10)

    # certbot rewrites this block to redirect to 443 when the cert is issued.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name depth.example.com;

    ssl_certificate     /etc/letsencrypt/live/depth.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/depth.example.com/privkey.pem;

    # No third-party scripts: fonts are self-hosted by next/font and every
    # number comes from our own API (§4 — no third-party price API).
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "DENY"               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Next.js fingerprints these, so they can be cached hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;   # P1 websocket
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

