# Nginx site for balast.xyz (§2: Hostinger VPS, PM2, Nginx).
#
# This file references TLS certificates, so it cannot be the FIRST config on a
# fresh server — nginx refuses to start when ssl_certificate points at a file
# that does not exist yet, and you cannot obtain a certificate without nginx
# answering on port 80. Use deploy/nginx-bootstrap.conf for that first pass;
# deploy/bootstrap.sh does the whole sequence in the right order.
#
# It also uses $connection_upgrade, which is defined in
# deploy/upgrade-map.conf — drop that into /etc/nginx/conf.d/ or `nginx -t`
# fails with "unknown variable". Check nothing else on the box already defines
# it first: a duplicate `map` also fails the test, and on a shared server that
# takes every other site down on the next reload.
#
# P1 adds two upstreams. The front end is still :3000; the Fastify API is
# :3001, and /api/stream is a websocket that has to stay open for hours.

server {
    listen 80;
    listen [::]:80;
    server_name balast.xyz www.balast.xyz;

    # ACME first, redirect second. If the challenge is redirected to HTTPS the
    # renewal fails, and a certificate that silently stops renewing takes the
    # whole front-end down 90 days later.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www redirects to the apex so there is one canonical host, one cookie scope
# and one URL in every link anyone ever shares.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.balast.xyz;

    ssl_certificate     /etc/letsencrypt/live/balast.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/balast.xyz/privkey.pem;

    return 301 https://balast.xyz$request_uri;
}

# Confusable spellings belong to us and 301 here. An unowned confusable is a
# phishing domain someone else gets to point at a wallet drainer.
#
# ballast.xyz — the English spelling on this same TLD — is NOT ours. It is
# registered and parked for sale by a third party. Acquire it and add it to
# the server_name below; until then this is the one real gap in the setup.
#
# server {
#     listen 443 ssl http2;
#     server_name ballast.xyz www.ballast.xyz balast.fi ballast.fi;
#     ssl_certificate     /etc/letsencrypt/live/balast.xyz/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/balast.xyz/privkey.pem;
#     return 301 https://balast.xyz$request_uri;
# }

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name balast.xyz;

    ssl_certificate     /etc/letsencrypt/live/balast.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/balast.xyz/privkey.pem;

    # No third-party scripts: fonts are self-hosted by next/font and every
    # number comes from our own API (§4 — no third-party price API).
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "DENY"               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy, in report-only mode first (§22). For a page
    # that asks people to connect a wallet this is the header that matters
    # most, and it is also the one most likely to break something: Next.js
    # inlines its hydration scripts and next/font its styles (hence the two
    # 'unsafe-inline's), WalletConnect's modal loads from its own hosts, and
    # logos are proxied through /api/logo but a wallet's own icon is a data:
    # URI. Watch the browser console on the box for violations for a few
    # days, then rename the header to Content-Security-Policy to enforce.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://rpc.mainnet.chain.robinhood.com https://rpc.robinhood.com https://*.walletconnect.com https://*.walletconnect.org https://*.reown.com wss://*.walletconnect.com wss://*.walletconnect.org wss://*.reown.com; frame-src https://verify.walletconnect.com https://verify.walletconnect.org https://verify.reown.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # add_header Content-Security-Policy "<the same value>" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Next.js fingerprints these, so they can be cached hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # P1: the websocket the indexer's ticks arrive on (§4.4). Its own block,
    # before /api/, because it needs the Upgrade headers and a read timeout
    # long enough to survive a quiet chain — a proxy that drops the socket
    # every 60s turns the push stream into a reconnect loop.
    location = /api/stream {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        # Buffering a stream defeats the point of streaming it.
        proxy_buffering off;
    }

    # P1: the indexer-backed API. Never cached — every response carries the
    # indexer's lag, and a cached lag figure is a lie about how fresh the
    # numbers are (§7).
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;   # P1 websocket
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

