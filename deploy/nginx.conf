# Nginx site for balast.xyz (§2: Hostinger VPS, PM2, Nginx).
# Copy to /etc/nginx/sites-available/balast, symlink into sites-enabled, then
# `nginx -t && systemctl reload nginx`. TLS is issued separately with certbot:
#
#   certbot --nginx -d balast.xyz -d www.balast.xyz

server {
    listen 80;
    listen [::]:80;
    server_name balast.xyz www.balast.xyz;

    # certbot rewrites this block to redirect to 443 when the cert is issued.
    location / {
        return 301 https://$host$request_uri;
    }
}

# www redirects to the apex so there is one canonical host, one cookie scope
# and one URL in every link anyone ever shares.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.balast.xyz;

    ssl_certificate     /etc/letsencrypt/live/balast.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/balast.xyz/privkey.pem;

    return 301 https://balast.xyz$request_uri;
}

# Confusable spellings belong to us and 301 here. An unowned confusable is a
# phishing domain someone else gets to point at a wallet drainer.
#
# ballast.xyz — the English spelling on this same TLD — is NOT ours. It is
# registered and parked for sale by a third party. Acquire it and add it to
# the server_name below; until then this is the one real gap in the setup.
#
# server {
#     listen 443 ssl http2;
#     server_name ballast.xyz www.ballast.xyz balast.fi ballast.fi;
#     ssl_certificate     /etc/letsencrypt/live/balast.xyz/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/balast.xyz/privkey.pem;
#     return 301 https://balast.xyz$request_uri;
# }

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name balast.xyz;

    ssl_certificate     /etc/letsencrypt/live/balast.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/balast.xyz/privkey.pem;

    # No third-party scripts: fonts are self-hosted by next/font and every
    # number comes from our own API (§4 — no third-party price API).
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "DENY"               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Next.js fingerprints these, so they can be cached hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;   # P1 websocket
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

